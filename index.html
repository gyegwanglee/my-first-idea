<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>내 첫 번째 아이디어</title>
  <meta name="description" content="세상을 바꿀 위대한 시작, 내 첫 번째 아이디어">
  
  <!-- Google Fonts: Pretendard / Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Pretendard:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>
  <div class="grid-overlay"></div>
  <div id="cursor-glow" class="cursor-glow"></div>

  <main class="center-container" id="main-container">
    <div class="glass-card" id="idea-card">
      <div class="badge">
        <span class="badge-dot"></span>
        <span class="badge-text">Day 1 &bull; Project 01</span>
      </div>

      <h1 class="main-title" id="main-title">
        <span class="gradient-text">내 첫 번째 아이디어</span>
      </h1>

      <p class="sub-quote">
        "위대한 모든 혁신은 아주 작은 생각 하나에서 시작됩니다."
      </p>

      <div class="card-footer">
        <button class="interactive-btn" id="inspire-btn" aria-label="영감 얻기">
          <span class="btn-icon">💡</span>
          <span class="btn-text">아이디어 밝히기</span>
        </button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
