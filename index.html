<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘도 힘내세요!</title>
  <meta name="description" content="응원의 메시지, 오늘도 힘내세요!">

  <!-- Google Fonts: Pretendard / Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Pretendard:wght@300;400;600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>
  <div class="grid-overlay"></div>
  <div id="cursor-glow" class="cursor-glow"></div>

  <main class="center-container" id="main-container">
    <div class="glass-card" id="idea-card">
      <div class="badge">
        <span class="badge-dot"></span>
        <span class="badge-text">Cheer Up &bull; 오늘도 힘내세요!</span>
      </div>

      <h1 class="main-title" id="main-title">
        <span class="gradient-text">오늘도 힘내세요!</span>
      </h1>

      <p class="sub-quote">
        "위대한 모든 혁신은 아주 작은 생각 하나에서 시작됩니다."
      </p>

      <div class="card-footer">
        <button class="interactive-btn" id="inspire-btn" aria-label="다음 문장 보기">
          <span class="btn-icon">✨</span>
          <span class="btn-text">다음 문장 보기</span>
        </button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
